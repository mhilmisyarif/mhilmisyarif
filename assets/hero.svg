<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Muhammad Hilmi Syarif, AI/ML Engineer focused on Natural Language Processing</title>
  <desc id="d">An animated terminal where a fine-tuned GPT-2 model turns the ingredients ayam, kecap manis and bawang putih into an Indonesian recipe, token by token.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0A1A33"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="22"/></clipPath>

    <!-- One clip per typed line. The width attribute is the finished state, so the text
         is fully visible wherever SMIL animation is not supported. -->
    <clipPath id="c0"><rect x="620" y="98" height="26" width="520">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;520;520;0" keyTimes="0;0.03;0.13;0.96;1"/>
    </rect></clipPath>
    <clipPath id="c1"><rect x="620" y="192" height="26" width="520">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;520;520;0" keyTimes="0;0.34;0.45;0.96;1"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="620" y="216" height="26" width="520">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;520;520;0" keyTimes="0;0.47;0.60;0.96;1"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="620" y="240" height="26" width="520">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;520;520;0" keyTimes="0;0.62;0.75;0.96;1"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <circle cx="130" cy="40" r="300" fill="url(#glowB)"/>
    <circle cx="1090" cy="360" r="320" fill="url(#glowA)"/>
  </g>

  <!-- Left: identity -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="116" font-size="14" font-weight="700" letter-spacing="3" fill="#22D3EE">AI/ML ENGINEER  ·  NLP</text>
    <text x="64" y="170" font-size="40" font-weight="800" fill="url(#name)">Muhammad Hilmi Syarif</text>
    <text x="64" y="212" font-size="19" fill="#CBD5E1">I teach machines to read and write</text>
    <text x="64" y="240" font-size="19" fill="#CBD5E1">Bahasa Indonesia.</text>

    <g font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">
      <rect x="64" y="274" width="72" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="100" y="294">GPT-2</text>
      <rect x="146" y="274" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="205" y="294">Transformers</text>
      <rect x="274" y="274" width="88" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="318" y="294">PyTorch</text>
      <rect x="372" y="274" width="108" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="426" y="294">Model APIs</text>
    </g>
  </g>

  <!-- Right: generation terminal -->
  <rect x="596" y="50" width="556" height="280" rx="14" fill="#0F172A" fill-opacity="0.92" stroke="#334155"/>
  <path d="M596 86h556" stroke="#1E293B"/>
  <circle cx="620" cy="68" r="5.5" fill="#F87171"/>
  <circle cx="640" cy="68" r="5.5" fill="#FBBF24"/>
  <circle cx="660" cy="68" r="5.5" fill="#34D399"/>
  <text x="874" y="73" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#64748B">indo-recipe-gpt2 · generate</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <!-- Prompt -->
    <text x="620" y="116" clip-path="url(#c0)" xml:space="preserve"><tspan fill="#FBBF24">&lt;|start-ingredients|&gt;</tspan><tspan fill="#E2E8F0"> ayam, kecap manis, bawang putih</tspan></text>

    <!-- Tokens -->
    <g font-size="13" text-anchor="middle">
      <g opacity="1">
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.150;0.165;0.96;1"/>
        <rect x="620" y="134" width="52" height="24" rx="6" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.55"/>
        <text x="646" y="151" fill="#A5F3FC">ayam</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.170;0.185;0.96;1"/>
        <rect x="678" y="134" width="25" height="24" rx="6" fill="#94A3B8" fill-opacity="0.14" stroke="#94A3B8" stroke-opacity="0.5"/>
        <text x="690.5" y="151" fill="#CBD5E1">,</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.190;0.205;0.96;1"/>
        <rect x="709" y="134" width="61" height="24" rx="6" fill="#818CF8" fill-opacity="0.16" stroke="#818CF8" stroke-opacity="0.6"/>
        <text x="739.5" y="151" fill="#C7D2FE">kecap</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.210;0.225;0.96;1"/>
        <rect x="776" y="134" width="61" height="24" rx="6" fill="#818CF8" fill-opacity="0.16" stroke="#818CF8" stroke-opacity="0.6"/>
        <text x="806.5" y="151" fill="#C7D2FE">manis</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.230;0.245;0.96;1"/>
        <rect x="843" y="134" width="25" height="24" rx="6" fill="#94A3B8" fill-opacity="0.14" stroke="#94A3B8" stroke-opacity="0.5"/>
        <text x="855.5" y="151" fill="#CBD5E1">,</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.250;0.265;0.96;1"/>
        <rect x="874" y="134" width="70" height="24" rx="6" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.55"/>
        <text x="909" y="151" fill="#A7F3D0">bawang</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.270;0.285;0.96;1"/>
        <rect x="950" y="134" width="61" height="24" rx="6" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.55"/>
        <text x="980.5" y="151" fill="#A7F3D0">putih</text>
      </g>
    </g>

    <!-- Generated recipe -->
    <text x="620" y="188" fill="#FBBF24" opacity="1">&lt;|start-steps|&gt;
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.31;0.325;0.96;1"/>
    </text>
    <text x="620" y="210" fill="#E2E8F0" clip-path="url(#c1)">1. Tumis bawang putih hingga harum.</text>
    <text x="620" y="234" fill="#E2E8F0" clip-path="url(#c2)">2. Masukkan ayam, aduk hingga berubah warna.</text>
    <text x="620" y="258" fill="#E2E8F0" clip-path="url(#c3)">3. Tuang kecap manis, masak hingga meresap.</text>
    <text x="620" y="290" fill="#FBBF24" opacity="1">&lt;|end-recipe|&gt;
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.78;0.795;0.96;1"/>
    </text>
    <rect x="620" y="300" width="9" height="16" fill="#22D3EE">
      <animate attributeName="opacity" dur="1.1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/>
    </rect>
  </g>
</svg>
